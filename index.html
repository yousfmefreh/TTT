<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f1">
  <title>رِحال — خطّط لرحلتك</title>
  <style>
    :root {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: #20352d;
      background: #f5f6f1;
      --green: #245b49;
      --muted: #78847e;
      --line: #e6e9e2;
      --paper: #fffefa;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(ellipse at 82% 4%, #f5eadd 0, transparent 27rem), #f5f6f1;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid #245b4938;
      outline-offset: 2px;
    }
    .page { width: min(1050px, calc(100% - 32px)); margin: auto; padding: 24px 0 42px; }
    header { display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 750; }
    .brand-icon { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 14px; background: var(--green); color: white; font-size: 21px; }
    .header-actions { display: flex; gap: 8px; }
    .quiet-button { min-height: 39px; padding: 0 13px; border: 1px solid var(--line); border-radius: 12px; background: #fffefa; color: #53625a; font-size: 13px; font-weight: 650; }
    .intro { max-width: 650px; margin: 52px auto 27px; text-align: center; }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 750; }
    .eyebrow::before { display: inline-block; width: 7px; height: 7px; margin-inline-end: 7px; border-radius: 50%; background: #e9a66a; content: ""; }
    h1 { margin: 11px 0 10px; font-size: clamp(34px, 5vw, 48px); letter-spacing: -1.5px; }
    .intro p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 18px; max-width: 910px; margin: auto; align-items: start; }
    .chat, .side { overflow: hidden; border: 1px solid #e3e7df; border-radius: 21px; background: var(--paper); box-shadow: 0 15px 40px #26392d0b; }
    .chat-head { display: flex; align-items: center; justify-content: space-between; padding: 17px 20px; border-bottom: 1px solid var(--line); }
    .assistant { display: flex; align-items: center; gap: 10px; }
    .avatar { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 13px; background: #e8f0e9; color: var(--green); font-size: 20px; }
    .assistant strong { display: block; font-size: 14px; }
    .status { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .status::before { display: inline-block; width: 6px; height: 6px; margin-inline-end: 5px; border-radius: 50%; background: #66a77c; content: ""; }
    .count { color: var(--muted); font-size: 12px; }
    .track { height: 3px; background: #f0f1eb; }
    .fill { width: 8%; height: 100%; background: var(--green); transition: width .25s ease; }
    .messages { display: flex; min-height: 265px; max-height: 430px; flex-direction: column; gap: 13px; overflow-y: auto; padding: 22px 20px; scroll-behavior: smooth; }
    .bubble { max-width: 88%; padding: 11px 14px; border-radius: 15px; font-size: 14px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
    .bot { align-self: flex-start; border: 1px solid #edf0e9; border-start-start-radius: 5px; background: #f7f8f4; }
    .user { align-self: flex-end; border-start-end-radius: 5px; background: var(--green); color: white; }
    .response { padding: 0 20px 20px; animation: show .18s ease-out; }
    @keyframes show { from { transform: translateY(4px); opacity: 0; } to { transform: none; opacity: 1; } }
    form { display: grid; gap: 10px; }
    .row { display: flex; gap: 9px; }
    .row > * { min-width: 0; flex: 1; }
    .input, select, textarea { width: 100%; min-height: 45px; padding: 0 12px; border: 1px solid #dfe4dc; border-radius: 11px; background: white; color: #20352d; font-size: 14px; }
    input[type="date"] { direction: ltr; text-align: start; }
    textarea { min-height: 82px; padding: 11px 12px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: #a0aaa3; }
    .primary, .choice { min-height: 44px; padding: 0 15px; border: 0; border-radius: 11px; font-size: 13px; font-weight: 700; }
    .primary { background: var(--green); color: white; }
    .primary:hover { background: #194637; }
    .choice { border: 1px solid #dfe4dc; background: white; color: #20352d; }
    .choice:hover { border-color: #9db5a5; background: #f5f8f4; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .error { min-height: 15px; color: #a13d32; font-size: 12px; }
    .side { padding: 20px; }
    .side h2 { margin: 0; font-size: 15px; }
    .side p { margin: 7px 0 15px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .steps { display: grid; gap: 5px; }
    .step { display: flex; min-height: 32px; align-items: center; gap: 10px; color: #929e96; font-size: 12px; }
    .step-number { display: grid; width: 24px; height: 24px; flex: 0 0 24px; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: white; font-size: 10px; }
    .step.active { color: var(--green); font-weight: 700; }
    .step.active .step-number { border-color: var(--green); background: var(--green); color: white; }
    .step.done { color: #60776a; }
    .step.done .step-number { border-color: #dce9df; background: #eaf3ec; color: var(--green); }
    .privacy { display: flex; gap: 8px; margin-top: 17px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.7; }
    .success-card { max-width: 470px; margin-top: 8px; padding: 20px; border: 1px solid #dfe9df; border-radius: 16px; background: #f5f9f4; }
    .success-card strong { display: block; margin-bottom: 6px; color: var(--green); font-size: 16px; }
    .success-card p { margin: 0 0 14px; color: #65756b; font-size: 13px; line-height: 1.7; }
    .office-link { display: inline-flex; min-height: 42px; align-items: center; padding: 0 15px; border-radius: 10px; background: var(--green); color: white; font-size: 13px; font-weight: 700; text-decoration: none; }
    .office-link:hover { background: #194637; }
    @media (max-width: 720px) {
      .page { width: min(100% - 22px, 550px); padding-top: 15px; }
      .intro { margin: 37px auto 20px; }
      .layout { grid-template-columns: 1fr; gap: 11px; }
      .side { padding: 12px 14px; }
      .side h2, .side p, .privacy { display: none; }
      .steps { display: flex; gap: 7px; overflow-x: auto; }
      .step { min-width: max-content; }
      .messages { min-height: 240px; max-height: 380px; padding: 18px 15px; }
      .response { padding: 0 15px 16px; }
      .chat-head { padding: 14px 15px; }
    }
    @media (max-width: 400px) {
      .brand { font-size: 17px; }
      .brand-icon { width: 36px; height: 36px; }
      .quiet-button { min-height: 35px; padding: 0 9px; font-size: 12px; }
      .row { flex-direction: column; }
    }
    html[dir="ltr"] .bot { border-start-start-radius: 15px; border-start-end-radius: 5px; }
    html[dir="ltr"] .user { border-start-end-radius: 15px; border-start-start-radius: 5px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand"><span class="brand-icon" aria-hidden="true">✦</span><span data-copy="brand">رِحال</span></div>
      <div class="header-actions">
        <button class="quiet-button" id="restart" type="button" data-copy="restart">ابدأ من جديد</button>
        <button class="quiet-button" id="language" type="button">English</button>
      </div>
    </header>
    <section class="intro">
      <div class="eyebrow" data-copy="eyebrow">مساعدك الشخصي للسفر</div>
      <h1 data-copy="headline">رحلتك تبدأ من هنا.</h1>
      <p data-copy="subtitle">جاوبني على كم سؤال سريع، وأرتّب لك طلب سفر يناسبك تمامًا.</p>
    </section>
    <section class="layout">
      <section class="chat" aria-label="Travel planning chat">
        <div class="chat-head">
          <div class="assistant"><span class="avatar" aria-hidden="true">✈</span><span><strong data-copy="assistant">مساعد رِحال</strong><span class="status" data-copy="status">متاح لمساعدتك</span></span></div>
          <span class="count" id="count"></span>
        </div>
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="messages" id="messages" aria-live="polite"></div>
        <div class="response" id="response"></div>
      </section>
      <aside class="side">
        <h2 data-copy="sideTitle">خطوات بسيطة، ورحلة أوضح</h2>
        <p data-copy="sideDescription">نجمع التفاصيل الأساسية خطوة بخطوة. تقدر تبدأ من جديد أو تغيّر اللغة بأي وقت.</p>
        <div class="steps" id="steps"></div>
        <div class="privacy"><span aria-hidden="true">♢</span><span data-copy="privacy">تظهر لك تفاصيل الرحلة للمراجعة قبل التأكيد.</span></div>
      </aside>
    </section>
  </main>
  <script>
    const words = {
      ar: {
        brand: "رِحال", restart: "ابدأ من جديد", eyebrow: "مساعدك الشخصي للسفر", headline: "رحلتك تبدأ من هنا.",
        subtitle: "جاوبني على كم سؤال سريع، وأرتّب لك طلب سفر يناسبك تمامًا.", assistant: "مساعد رِحال", status: "متاح لمساعدتك",
        sideTitle: "خطوات بسيطة، ورحلة أوضح", sideDescription: "نجمع التفاصيل الأساسية خطوة بخطوة. تقدر تبدأ من جديد أو تغيّر اللغة بأي وقت.",
        privacy: "تظهر لك تفاصيل الرحلة للمراجعة قبل التأكيد.",
        stepNames: ["الوجهة", "نوع الرحلة", "المسافرون", "الميزانية", "التفضيلات", "التأكيد"],
        hello: "أهلًا! أنا رِحال، وبساعدك تخطّط لرحلتك خطوة بخطوة.",
        destination: "وين حاب تسافر؟", destinationHint: "مثال: طوكيو، اليابان",
        tripType: "رحلتك ذهاب وعودة أو ذهاب فقط؟", roundTrip: "ذهاب وعودة", oneWay: "ذهاب فقط",
        departureDate: "متى تاريخ المغادرة؟", returnDate: "ومتى تاريخ العودة؟", adults: "كم عدد المسافرين البالغين؟",
        children: "وكم عدد الأطفال؟", budget: "كم ميزانيتك التقريبية للرحلة؟", budgetHint: "المبلغ",
        currency: "العملة", currencyHint: "اختر العملة", flight: "أي خيار تفضّل للرحلة الجوية؟",
        direct: "رحلات مباشرة", anyFlight: "أي خيار مناسب", hotel: "كم نجمة تفضّل للفندق؟",
        anyStars: "بدون تفضيل", stars: (n) => `${n} نجوم`, notes: "هل عندك نشاط أو طلب خاص تحب نعرفه؟",
        notesHint: "مثال: أماكن مناسبة للأطفال، أو فندق قريب من وسط المدينة", skip: "تخطي",
        summaryPrompt: "هذا ملخص طلب رحلتك. هل كل التفاصيل صحيحة؟", summaryTitle: "ملخص رحلتك",
        destinationLabel: "الوجهة", tripLabel: "نوع الرحلة", departLabel: "المغادرة", returnLabel: "العودة",
        travelersLabel: "المسافرون", budgetLabel: "الميزانية", preferencesLabel: "التفضيلات",
        adultsCount: (n) => `${n} بالغ`, childrenCount: (n) => `${n} طفل`,
        confirm: "نعم، أكّد الرحلة", startOver: "ابدأ من جديد",
        successTitle: "تم تأكيد طلبك بنجاح!",
        success: "أرسلنا تفاصيل رحلتك إلى صفحة عرض الطلبات الخاصة بمكاتب السفر.",
        viewOffice: "عرض الطلب للمكاتب", storageError: "ما قدرنا نحفظ الطلب على هذا الجهاز. حاول مرة ثانية.",
        continue: "متابعة", invalid: "يرجى إدخال قيمة صحيحة للمتابعة.", invalidDate: "اختر تاريخًا صالحًا اليوم أو بعده.",
        dateOrder: "تاريخ العودة يجب أن يكون بعد تاريخ المغادرة.", directLabel: "مباشر", anyLabel: "أي خيار",
        noPreference: "بدون تفضيل", dateLocale: "ar", count: (n, total) => `${n} / ${total}`,
        currencies: [["USD", "دولار أمريكي (USD)"], ["SAR", "ريال سعودي (SAR)"], ["AED", "درهم إماراتي (AED)"], ["EUR", "يورو (EUR)"], ["GBP", "جنيه إسترليني (GBP)"], ["EGP", "جنيه مصري (EGP)"], ["KWD", "دينار كويتي (KWD)"], ["QAR", "ريال قطري (QAR)"], ["BHD", "دينار بحريني (BHD)"], ["OMR", "ريال عُماني (OMR)"], ["JOD", "دينار أردني (JOD)"], ["OTHER", "أخرى"]]
      },
      en: {
        brand: "Rihal", restart: "Start over", eyebrow: "Your personal travel assistant", headline: "Your trip starts here.",
        subtitle: "Answer a few quick questions and I'll put together a travel request that fits you.", assistant: "Rihal assistant", status: "Here to help",
        sideTitle: "A few steps to a clearer trip", sideDescription: "We'll collect the essentials one step at a time. Restart or change language whenever you like.",
        privacy: "Your trip details are shown for review before confirmation.",
        stepNames: ["Destination", "Trip type", "Travelers", "Budget", "Preferences", "Confirm"],
        hello: "Hi! I'm Rihal, and I'll help you plan one step at a time.",
        destination: "Where would you like to go?", destinationHint: "e.g. Tokyo, Japan",
        tripType: "Is this round-trip or one-way?", roundTrip: "Round-trip", oneWay: "One-way",
        departureDate: "When would you like to depart?", returnDate: "When would you like to return?", adults: "How many adult travelers?",
        children: "And how many children?", budget: "What's your estimated trip budget?", budgetHint: "Amount",
        currency: "Currency", currencyHint: "Choose a currency", flight: "Which flight option do you prefer?",
        direct: "Direct flights", anyFlight: "Any option", hotel: "What hotel star rating do you prefer?",
        anyStars: "No preference", stars: (n) => `${n} stars`, notes: "Any special activities or requests you'd like us to know?",
        notesHint: "e.g. family-friendly activities or a hotel near the city center", skip: "Skip",
        summaryPrompt: "Here's a summary of your trip request. Does everything look right?", summaryTitle: "Trip summary",
        destinationLabel: "Destination", tripLabel: "Trip type", departLabel: "Departure", returnLabel: "Return",
        travelersLabel: "Travelers", budgetLabel: "Budget", preferencesLabel: "Preferences",
        adultsCount: (n) => `${n} adult${n === 1 ? "" : "s"}`, childrenCount: (n) => `${n} child${n === 1 ? "" : "ren"}`,
        confirm: "Yes, confirm trip", startOver: "Start over",
        successTitle: "Your request is confirmed!",
        success: "Your trip details have been sent to the travel offices' request page.",
        viewOffice: "View office requests", storageError: "We couldn't save the request on this device. Please try again.",
        continue: "Continue", invalid: "Please enter a valid value to continue.", invalidDate: "Choose a valid date today or later.",
        dateOrder: "Return date must be after departure date.", directLabel: "Direct", anyLabel: "Any option",
        noPreference: "No preference", dateLocale: "en", count: (n, total) => `${n} / ${total}`,
        currencies: [["USD", "US Dollar (USD)"], ["SAR", "Saudi Riyal (SAR)"], ["AED", "UAE Dirham (AED)"], ["EUR", "Euro (EUR)"], ["GBP", "British Pound (GBP)"], ["EGP", "Egyptian Pound (EGP)"], ["KWD", "Kuwaiti Dinar (KWD)"], ["QAR", "Qatari Riyal (QAR)"], ["BHD", "Bahraini Dinar (BHD)"], ["OMR", "Omani Rial (OMR)"], ["JOD", "Jordanian Dinar (JOD)"], ["OTHER", "Other"]]
      }
    };
    const state = { lang: "ar", answers: {}, flow: [], index: 0, confirmed: false, requestId: null };
    const messages = document.getElementById("messages");
    const response = document.getElementById("response");
    const steps = document.getElementById("steps");
    const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const t = (key) => words[state.lang][key];

    function buildFlow() {
      state.flow = ["destination", "tripType", "departureDate"];
      if (state.answers.tripType === "round_trip") state.flow.push("returnDate");
      state.flow.push("adults", "children", "budget", "currency", "flight", "hotel", "notes", "confirmation");
    }
    function addMessage(content, role = "bot") {
      const el = document.createElement("div");
      el.className = `bubble ${role}`;
      el.textContent = content;
      messages.append(el);
      messages.scrollTop = messages.scrollHeight;
    }
    function progress() {
      const current = state.flow[state.index] === "confirmation" || state.confirmed ? 5 : state.index < 2 ? 0 : state.index < 4 ? 1 : state.index < 6 ? 2 : state.index < 8 ? 3 : 4;
      steps.innerHTML = "";
      t("stepNames").forEach((label, i) => {
        const el = document.createElement("div");
        el.className = `step${i === current ? " active" : i < current ? " done" : ""}`;
        el.innerHTML = `<span class="step-number">${i < current ? "✓" : i + 1}</span><span>${label}</span>`;
        steps.append(el);
      });
      const total = state.flow.length || 11;
      document.getElementById("count").textContent = t("count")(Math.min(state.index + 1, total), total);
      document.getElementById("fill").style.width = `${state.confirmed ? 100 : Math.min(95, state.index / total * 100)}%`;
    }
    function setLanguage(lang) {
      state.lang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.title = lang === "ar" ? "رِحال — خطّط لرحلتك" : "Rihal — Plan your trip";
      document.querySelectorAll("[data-copy]").forEach((el) => { el.textContent = t(el.dataset.copy); });
      document.getElementById("language").textContent = lang === "ar" ? "English" : "العربية";
      if (!state.confirmed && state.index === 0) {
        messages.innerHTML = "";
        addMessage(t("hello"));
        ask();
      }
      progress();
      if (state.confirmed) showConfirmation(state.requestId);
      else if (state.index > 0) ask();
    }
    function choices(items, onSelect) {
      const list = document.createElement("div");
      list.className = "choices";
      items.forEach(([value, label]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.textContent = label;
        button.addEventListener("click", () => onSelect(value, label), { once: true });
        list.append(button);
      });
      response.append(list);
    }
    function answer(value, shown) {
      const key = state.flow[state.index];
      const answerKey = { flight: "flightPreference", hotel: "hotelStars", notes: "specialNotes" }[key] || key;
      state.answers[answerKey] = value;
      addMessage(shown, "user");
      state.index++;
      progress();
      ask();
    }
    function ask() {
      response.innerHTML = "";
      if (state.index >= state.flow.length) return;
      const key = state.flow[state.index];
      progress();
      if (key === "confirmation") {
        addMessage(t("summaryPrompt"));
        showSummary();
        return;
      }
      addMessage(t(key));
      if (key === "tripType") {
        choices([["round_trip", t("roundTrip")], ["one_way", t("oneWay")]], (value, label) => {
          state.answers.tripType = value;
          buildFlow();
          answer(value, label);
        });
        return;
      }
      if (key === "flight") {
        choices([["direct", t("direct")], ["any", t("anyFlight")]], (value, label) => answer(value, label));
        return;
      }
      if (key === "hotel") {
        choices([["", t("anyStars")], ...[3, 4, 5].map((n) => [String(n), t("stars")(n)])], (value, label) => answer(value || null, label));
        return;
      }
      renderForm(key);
    }
    function renderForm(key) {
      const form = document.createElement("form");
      const error = document.createElement("div");
      error.className = "error";
      error.setAttribute("role", "alert");
      const submit = document.createElement("button");
      submit.type = "submit";
      submit.className = "primary";
      submit.textContent = t("continue");
      let input;
      if (key === "budget" || key === "currency") {
        const row = document.createElement("div");
        row.className = "row";
        if (key === "budget") {
          input = document.createElement("input");
          input.type = "number";
          input.min = "0.01";
          input.step = "0.01";
          input.inputMode = "decimal";
          input.placeholder = t("budgetHint");
          input.className = "input";
        } else {
          input = document.createElement("select");
          input.className = "input";
          const placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = t("currencyHint");
          placeholder.disabled = true;
          placeholder.selected = true;
          input.append(placeholder);
          t("currencies").forEach(([value, label]) => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = label;
            input.append(option);
          });
        }
        row.append(input);
        form.append(row, error, submit);
      } else if (key === "notes") {
        input = document.createElement("textarea");
        input.maxLength = 400;
        input.placeholder = t("notesHint");
        const buttons = document.createElement("div");
        buttons.className = "row";
        const skip = document.createElement("button");
        skip.type = "button";
        skip.className = "choice";
        skip.textContent = t("skip");
        skip.addEventListener("click", () => answer(null, t("skip")));
        buttons.append(submit, skip);
        form.append(input, error, buttons);
      } else {
        input = document.createElement("input");
        input.type = key.endsWith("Date") ? "date" : key === "destination" ? "text" : "number";
        input.className = "input";
        if (key === "destination") {
          input.placeholder = t("destinationHint");
          input.maxLength = 120;
        } else if (input.type === "date") {
          input.min = today;
        } else {
          input.min = key === "adults" ? "1" : "0";
          input.max = "99";
          input.step = "1";
          input.placeholder = "0";
        }
        form.append(input, error, submit);
      }
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const value = input.value.trim();
        if (key === "notes") {
          answer(value || null, value || t("skip"));
          return;
        }
        if (!value) {
          error.textContent = t("invalid");
          input.focus();
          return;
        }
        if (key === "departureDate" || key === "returnDate") {
          if (value < today) {
            error.textContent = t("invalidDate");
            return;
          }
          if (key === "returnDate" && value <= state.answers.departureDate) {
            error.textContent = t("dateOrder");
            return;
          }
          answer(value, new Intl.DateTimeFormat(words[state.lang].dateLocale, { dateStyle: "long", timeZone: "UTC" }).format(new Date(`${value}T00:00:00Z`)));
          return;
        }
        if (key === "adults" || key === "children") {
          const number = Number(value);
          if (!Number.isInteger(number) || number < Number(input.min) || number > 99) {
            error.textContent = t("invalid");
            input.focus();
            return;
          }
          answer(number, value);
          return;
        }
        if (key === "budget") {
          const amount = Number(value);
          if (!Number.isFinite(amount) || amount <= 0) {
            error.textContent = t("invalid");
            input.focus();
            return;
          }
          answer(amount, value);
          return;
        }
        const currency = t("currencies").find(([code]) => code === value);
        answer(value, currency ? currency[1] : value);
      });
      response.append(form);
      if (input) input.focus({ preventScroll: true });
    }
    function dateLabel(value) {
      return new Intl.DateTimeFormat(words[state.lang].dateLocale, { dateStyle: "long", timeZone: "UTC" }).format(new Date(`${value}T00:00:00Z`));
    }
    function showSummary() {
      const a = state.answers;
      const lines = [
        `${t("destinationLabel")}: ${a.destination}`,
        `${t("tripLabel")}: ${a.tripType === "round_trip" ? t("roundTrip") : t("oneWay")}`,
        `${t("departLabel")}: ${dateLabel(a.departureDate)}`,
        ...(a.tripType === "round_trip" ? [`${t("returnLabel")}: ${dateLabel(a.returnDate)}`] : []),
        `${t("travelersLabel")}: ${t("adultsCount")(a.adults)}${a.children ? `، ${t("childrenCount")(a.children)}` : ""}`,
        `${t("budgetLabel")}: ${a.budget} ${a.currency}`,
        `${t("preferencesLabel")}: ${a.flightPreference === "direct" ? t("directLabel") : t("anyLabel")}, ${a.hotelStars ? t("stars")(Number(a.hotelStars)) : t("noPreference")}${a.specialNotes ? `\n${a.specialNotes}` : ""}`
      ];
      const summary = document.createElement("div");
      summary.className = "bubble bot";
      summary.textContent = `${t("summaryTitle")}\n${lines.join("\n")}`;
      messages.append(summary);
      messages.scrollTop = messages.scrollHeight;
      choices([["yes", t("confirm")], ["restart", t("startOver")]], (value) => {
        if (value === "restart") {
          restart();
          return;
        }
        state.confirmed = true;
        addMessage(t("confirm"), "user");
        submitRequest();
      });
    }
    function createPayload() {
      const a = state.answers;
      return {
        request_status: "confirmed",
        language: state.lang,
        destination: a.destination,
        trip_type: a.tripType,
        departure_date: a.departureDate,
        return_date: a.tripType === "round_trip" ? a.returnDate : null,
        travelers: { adults: a.adults, children: a.children },
        budget: { amount: a.budget, currency: a.currency },
        preferences: {
          hotel_stars: a.hotelStars || null,
          flight_preference: a.flightPreference,
          special_notes: a.specialNotes || null
        }
      };
    }
    function submitRequest() {
      const payload = createPayload();
      const requestId = `RH-${Date.now().toString(36).toUpperCase()}`;
      const request = { ...payload, request_id: requestId, office_status: "new", created_at: new Date().toISOString() };
      try {
        const saved = localStorage.getItem("rihal.officeRequests.v1");
        const requests = saved ? JSON.parse(saved) : [];
        if (!Array.isArray(requests)) throw new Error("Stored travel requests are not a list.");
        requests.unshift(request);
        localStorage.setItem("rihal.officeRequests.v1", JSON.stringify(requests));
      } catch (error) {
        console.error("Could not save travel request for office review.", error);
        response.innerHTML = "";
        const notice = document.createElement("div");
        notice.className = "error";
        notice.textContent = t("storageError");
        response.append(notice);
        return;
      }
      state.requestId = requestId;
      state.confirmed = true;
      progress();
      showConfirmation(requestId);
    }
    function showConfirmation(requestId) {
      response.innerHTML = "";
      if (!messages.querySelector(".success")) {
        const notice = document.createElement("div");
        notice.className = "bubble bot success";
        notice.textContent = t("success");
        messages.append(notice);
      }
      const card = document.createElement("section");
      card.className = "success-card";
      const title = document.createElement("strong");
      title.textContent = t("successTitle");
      const description = document.createElement("p");
      description.textContent = t("success");
      const link = document.createElement("a");
      link.className = "office-link";
      link.href = "office.html";
      link.textContent = t("viewOffice");
      card.append(title, description, link);
      response.append(card);
      if (requestId) {
        link.href = `office.html?request=${encodeURIComponent(requestId)}`;
      }
      messages.scrollTop = messages.scrollHeight;
    }
    function restart() {
      state.answers = {};
      state.index = 0;
      state.confirmed = false;
      state.requestId = null;
      buildFlow();
      messages.innerHTML = "";
      response.innerHTML = "";
      addMessage(t("hello"));
      progress();
      ask();
    }
    document.getElementById("language").addEventListener("click", () => setLanguage(state.lang === "ar" ? "en" : "ar"));
    document.getElementById("restart").addEventListener("click", restart);
    buildFlow();
    setLanguage("ar");
  </script>
</body>
</html>
